<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — Bhaswanth Chiruthanuru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Grotesk:ital,wght@1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ RESET ============ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font: inherit; cursor: pointer; }

  /* ============ TOKENS ============ */
  :root{
    --bg: #060b16;
    --panel: #0a1322;
    --border: #16283c;
    --border-hover: rgba(94,234,212,0.38);
    --teal: #5eead4;
    --teal-dim: #2dd4bf;
    --blue: #5b9bf5;
    --ink: #e7edf5;
    --ink-dim: #9fb0c3;
    --ink-faint: #64748b;
    --radius: 14px;
    --radius-sm: 10px;
    --maxw: 1080px;
  }

  html{ scroll-behavior: smooth; }

  body{
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 12% -5%, rgba(45,212,191,0.08), transparent 38%),
      radial-gradient(circle at 92% 8%, rgba(94,234,212,0.05), transparent 32%);
    background-attachment: fixed;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .mono{ font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }
  ::selection{ background: rgba(94,234,212,0.25); color: #fff; }
  :focus-visible{ outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 4px; }

  .wrap{ max-width: var(--maxw); margin: 0 auto; padding: 0 18px; }

  /* ============ NAV ============ */
  .site-nav{
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(6,11,22,0.85);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  .site-nav .wrap{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    padding-bottom: 16px;
  }
  .brand{
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .nav-links{
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .nav-links a{
    font-size: 13.5px;
    color: var(--ink-dim);
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }
  .nav-links a:hover{ color: var(--ink); }
  .nav-links a.active{
    color: var(--teal);
    border-bottom-color: var(--teal);
  }

  /* ============ HERO ============ */
  .hero{
    text-align: center;
    padding: 56px 18px 40px;
  }
  .post-count{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-bottom: 18px;
  }
  .post-count .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 4px rgba(94,234,212,0.15);
  }
  .hero h1{
    font-size: clamp(1.7rem, 6vw, 2.7rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
    margin: 0 0 16px;
    line-height: 1.15;
  }
  .hero h1 em{
    font-style: italic;
    color: var(--blue);
    font-weight: 700;
  }
  .hero p{
    max-width: 560px;
    margin: 0 auto;
    font-size: 14.5px;
    color: var(--ink-dim);
    line-height: 1.65;
  }

  /* ============ SHARED CARD BITS ============ */
  .tag-chip{
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 5px;
    background: rgba(94,234,212,0.07);
    border: 1px solid rgba(94,234,212,0.22);
    color: var(--teal);
    margin-bottom: 12px;
  }
  .post-excerpt{
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.6;
    margin: 0 0 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .post-meta{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .read-link{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--teal);
    transition: gap .2s ease;
  }
  .read-link:hover{ gap: 8px; }
  .read-link svg{ width: 13px; height: 13px; }

  /* cover art */
  .cover{
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #0d1a2c;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover svg{ width: 34px; height: 34px; color: rgba(148,169,196,0.35); }
  .cover.grad-circuit{ background: radial-gradient(circle at 30% 30%, #2a1b4d, #0a0f22 65%); }
  .cover.grad-code{ background: linear-gradient(135deg, #10233a, #0a1322 70%); }
  .cover.grad-php{ background: linear-gradient(135deg, #1c2b4a, #101820); }
  .cover.grad-sunset{ background: linear-gradient(135deg, #ff9a76 0%, #a86ee8 45%, #3f5efb 100%); }
  .cover.grad-light{ background: radial-gradient(circle at 50% 40%, #ffe9b8, #5b9bf5 60%, #14213a 100%); }
  .cover.grad-heart{ background: linear-gradient(160deg, #2b2f38, #12151b 75%); }
  .cover-label{
    position: absolute;
    bottom: 10px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 2px 14px rgba(0,0,0,0.4);
  }
  .cover-icon-lg{
    width: 48px;
    height: 48px;
    color: rgba(255,255,255,0.9);
  }

  /* ============ FEATURED POST ============ */
  main.wrap{ padding-bottom: 60px; }

  .featured{
    display: flex;
    flex-direction: column;
    gap: 20px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(94,234,212,0.03), rgba(94,234,212,0) 20%), var(--panel);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
    transition: border-color .25s ease;
  }
  .featured:hover{ border-color: var(--border-hover); }
  .featured .cover{ aspect-ratio: 16/10; border-radius: 10px; }
  .featured-content{ padding: 6px 10px 10px; }
  .featured-content h2{
    font-size: clamp(1.2rem, 3.4vw, 1.6rem);
    font-weight: 700;
    color: #fff;
    margin: 0 0 12px;
    line-height: 1.25;
  }
  .featured-content .post-excerpt{ -webkit-line-clamp: 4; font-size: 13.5px; }

  /* ============ SECONDARY ROW (2 cards) ============ */
  .secondary-row{
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .post-card{
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
    border-radius: var(--radius);
    padding: 12px;
    transition: border-color .25s ease, transform .25s ease;
  }
  .post-card:hover{
    border-color: var(--border-hover);
    transform: translateY(-3px);
  }
  .post-card .post-body{ padding: 14px 8px 6px; }
  .post-card h3{
    font-size: 15.5px;
    font-weight: 600;
    color: #fff;
    margin: 0 0 10px;
    line-height: 1.3;
  }

  /* ============ GRID ============ */
  .post-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }
  .post-grid .post-card h3{ font-size: 14.5px; }
  .post-grid .post-excerpt{ -webkit-line-clamp: 2; }
  .post-grid .post-meta{ justify-content: flex-start; }

  /* ============ PAGINATION ============ */
  .pagination{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .page-btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
  }
  .page-btn:hover{ border-color: var(--border-hover); color: var(--ink); }
  .page-btn.active{
    border-color: rgba(94,234,212,0.5);
    color: var(--teal);
    background: rgba(94,234,212,0.06);
  }
  .page-btn svg{ width: 15px; height: 15px; }
  .page-btn:disabled{ opacity: 0.35; cursor: not-allowed; }

  /* ============ FOOTER ============ */
  footer{
    text-align: center;
    padding: 26px 18px 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    border-top: 1px solid var(--border);
  }
  footer span{ color: var(--teal); }

  /* ============ SCROLL REVEAL ============ */
  .fade-up{
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .fade-up.in-view{ opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .fade-up{ transition: none; opacity: 1; transform: none; }
    html{ scroll-behavior: auto; }
  }

  /* ================================================================
     BREAKPOINTS (mobile-first)
     sm  -> 640px
     md  -> 768px
     lg  -> 1024px
  ================================================================ */

  @media (min-width: 640px){
    .wrap{ padding: 0 28px; }
    .hero{ padding: 68px 28px 46px; }

    .featured{ flex-direction: row; align-items: stretch; padding: 16px; }
    .featured .cover{ width: 44%; flex-shrink: 0; aspect-ratio: auto; }
    .featured-content{ display: flex; flex-direction: column; justify-content: center; padding: 10px 14px; }

    .secondary-row{ grid-template-columns: repeat(2, 1fr); }
    .post-grid{ grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 1024px){
    .post-grid{ grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

  <nav class="site-nav">
    <div class="wrap">
      <span class="brand">Bhaswanth Chiruthanuru</span>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#" class="active">Blog</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <p class="post-count"><span class="dot"></span>15 POSTS PUBLISHED</p>
    <h1>Writing &amp; <em>thinking</em> out loud.</h1>
    <p>Ideas on design, engineering, and the craft of building things. Sometimes a tutorial, sometimes a rant, always honest.</p>
  </header>

  <main class="wrap">
    <div id="featured-slot"></div>
    <div class="secondary-row" id="secondary-slot"></div>
    <div class="post-grid" id="grid-slot"></div>

    <div class="pagination" id="pagination"></div>
  </main>

  <footer>
    Designed &amp; Developed by <span>Bhaswanth Chiruthanuru</span>
  </footer>

<script>
  // ---------- icon library ----------
  const icons = {
    image: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>`,
    circuit: `<svg class="cover-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>`,
    code: `<svg class="cover-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 6L2 12l6 6M16 6l6 6-6 6"/></svg>`,
    hand: `<svg class="cover-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2v10M8 22c-3-3-6-6-6-9a2 2 0 014 0M8 22h8M16 22c3-3 6-6 6-9a2 2 0 00-4 0M12 12l-4 4M12 12l4 4"/></svg>`,
    heart: `<svg class="cover-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 8c0 4-3 7-8 12-5-5-8-8-8-12a4 4 0 018-1 4 4 0 018 1z"/></svg>`,
    people: `<svg class="cover-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2 21c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 21c0-2.6 2-4.8 4.5-5"/></svg>`
  };

  // ---------- data ----------
  const featured = {
    tag: "Programming",
    title: "How I optimized PHP project in 3 days",
    excerpt: "This happened nearly 6 years ago, around the year 2019. I was working on my first job at the time as a junior web developer. At that time I was working on an e-learning platform. My work mainly revo...",
    date: "February 21, 2024",
    extra: "Featured",
    cover: "grad-circuit",
    coverIcon: icons.circuit
  };

  const secondary = [
    {
      tag: "Programming",
      title: "Why I love working with Legacy Codebases",
      excerpt: "Almost every developer must've worked on at least one legacy project in their career. And the first reaction is almost always the same: You open the codebase and think, \"Who wrote this code?\" Why is this...",
      date: "February 11, 2024",
      cover: "grad-code",
      coverIcon: icons.code
    },
    {
      tag: "Programming",
      title: "I've moved away from PHP and then regretted it",
      excerpt: "I started my career with PHP. I was pretty decent at building things. Not the \"copy-paste a snippet and pray\" kind, but a real Core PHP, Laravel, full-stack developer building things end to end. An...",
      date: "February 03, 2024",
      cover: "grad-php",
      coverLabel: "php"
    }
  ];

  const gridPage1 = [
    { tag: "Social Life", title: "The Alumni Meeting", excerpt: "Kempegowda International Airport, it was night, and the flight to Pune, Maharastra, was about t...", date: "April 23, 2023", cover: "grad-sunset", coverIcon: icons.people },
    { tag: "Social Life", title: "A Message From God", excerpt: "Evening 5:30 pm, Bengaluru. I am taking a walk in the nearby park. It was a beautiful evening...", date: "February 07, 2023", cover: "grad-light", coverIcon: icons.hand },
    { tag: "Social Life", title: "Love & Freedom", excerpt: "It was a beautiful evening. The sky is vermilion which is lovely to see. Children's games and th...", date: "August 10, 2022", cover: "grad-heart", coverIcon: icons.heart },
    { tag: "Social Life", title: "Love At First Sight", excerpt: "Night 11:00. The road is almost silent. Most of the people have already gone to sleep in their houses. Some shopkeepers are preparing to...", date: "April 05, 2022", placeholder: true },
    { tag: "Self Development", title: "A day in the life of an IT employee", excerpt: "Bengaluru Udipi Garden Park, Saturday 6:30 pm. \"If you didn't finish the work before Monday...", date: "April 16, 2021", placeholder: true },
    { tag: "Social Life", title: "Love In The Moon Light", excerpt: "Bengaluru, Friday Night 09:30 PM. Bengaluru. Time is 09:30 PM. The whole city is about to sleep. The roads are filled with rainwater, the...", date: "April 16, 2021", placeholder: true },
    { tag: "Social Life", title: "The Valentines Day", excerpt: "February 14 (Valentines Day) at 5:30 PM. Today is the symbol of love. For couples, today is an...", date: "April 16, 2021", placeholder: true },
    { tag: "Self Development", title: "The Hidden You", excerpt: "Hi friends, it's me your Bhaswanth. Hope you know me well as you read my previous strifes...", date: "April 16, 2021", placeholder: true },
    { tag: "Social Life", title: "The Hunt For King", excerpt: "Once upon a time, there is a forest. Obviously Lion is the king of the forest. In the...", date: "April 16, 2021", placeholder: true }
  ];

  const gridPage2 = [
    { tag: "Programming", title: "Debugging at 3 AM", excerpt: "There's a special kind of silence that only exists at 3 AM when a production server just went down and you're the only one awake to fix it...", date: "March 12, 2021", placeholder: true },
    { tag: "Self Development", title: "The Art of Saying No", excerpt: "For most of my early career I said yes to everything. Every extra task, every favour, every scope creep. It took years to learn otherwise...", date: "February 18, 2021", placeholder: true },
    { tag: "Programming", title: "Building My First Startup Idea", excerpt: "It started as a weekend project between two friends and a whiteboard full of bad diagrams. Here's what actually happened when we tried to ship it...", date: "January 09, 2021", placeholder: true }
  ];

  // ---------- render helpers ----------
  function renderCover(post){
    if (post.placeholder) {
      return `<div class="cover">${icons.image}</div>`;
    }
    const iconHtml = post.coverIcon ? post.coverIcon : '';
    const labelHtml = post.coverLabel ? `<span class="cover-label">${post.coverLabel}</span>` : '';
    return `<div class="cover ${post.cover || ''}">${iconHtml}${labelHtml}</div>`;
  }

  function renderFeatured(post){
    return `
      <article class="featured fade-up">
        ${renderCover(post)}
        <div class="featured-content">
          <span class="tag-chip">${post.tag.toUpperCase()}</span>
          <h2>${post.title}</h2>
          <p class="post-excerpt">${post.excerpt}</p>
          <div class="post-meta">
            <span>${post.date} &nbsp;·&nbsp; ${post.extra}</span>
            <a href="#" class="read-link">Read <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          </div>
        </div>
      </article>
    `;
  }

  function renderSecondaryCard(post){
    return `
      <article class="post-card fade-up">
        ${renderCover(post)}
        <div class="post-body">
          <span class="tag-chip">${post.tag.toUpperCase()}</span>
          <h3>${post.title}</h3>
          <p class="post-excerpt">${post.excerpt}</p>
          <div class="post-meta">
            <span>${post.date}</span>
            <a href="#" class="read-link">Read <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          </div>
        </div>
      </article>
    `;
  }

  function renderGridCard(post){
    return `
      <article class="post-card fade-up">
        ${renderCover(post)}
        <div class="post-body">
          <span class="tag-chip">${post.tag.toUpperCase()}</span>
          <h3>${post.title}</h3>
          <p class="post-excerpt">${post.excerpt}</p>
          <div class="post-meta"><span>${post.date}</span></div>
        </div>
      </article>
    `;
  }

  function initObserver(){
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll('.fade-up:not(.in-view)').forEach(el => observer.observe(el));
  }

  const pages = { 1: gridPage1, 2: gridPage2 };
  let currentPage = 1;

  function renderPage(page){
    currentPage = page;

    document.getElementById('featured-slot').innerHTML = renderFeatured(featured);
    document.getElementById('secondary-slot').innerHTML = secondary.map(renderSecondaryCard).join('');
    document.getElementById('grid-slot').innerHTML = pages[page].map(renderGridCard).join('');

    renderPagination();
    initObserver();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPagination(){
    const totalPages = Object.keys(pages).length;
    let html = `<button class="page-btn" id="prev-btn" ${currentPage === 1 ? 'disabled' : ''} aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg>
      </button>`;
    for (let i = 1; i <= totalPages; i++){
      html += `<button class="page-btn mono ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    html += `<button class="page-btn" id="next-btn" ${currentPage === totalPages ? 'disabled' : ''} aria-label="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
      </button>`;

    const el = document.getElementById('pagination');
    el.innerHTML = html;

    el.querySelectorAll('[data-page]').forEach(btn => {
      btn.addEventListener('click', () => renderPage(Number(btn.dataset.page)));
    });
    const prev = document.getElementById('prev-btn');
    const next = document.getElementById('next-btn');
    if (prev) prev.addEventListener('click', () => { if (currentPage > 1) renderPage(currentPage - 1); });
    if (next) next.addEventListener('click', () => { if (currentPage < totalPages) renderPage(currentPage + 1); });
  }

  renderPage(1);
</script>
</body>
</html>
