<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wsywig Experiment</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .toolbar {
            margin-bottom: 10px;
        }

        .toolbar button {
            padding: 8px;
        }

        .editor {
            min-height: 300px;
            border: 1px solid #ccc;
            padding: 15px;
        }

        #preview {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <button data-command="bold">Bold</button>
        <button data-command="italic">Italic</button>
        <button data-command="underline">Underline</button>

        <button id="preview-btn">
            Preview
        </button>
    </div>

    <div id="editor" contenteditable="true" class="editor">
    </div>

    <div id="preview"></div>

    <script>
        const editor = document.getElementById('editor');

        document.querySelectorAll('[data-command]')
            .forEach(button => {

                button.addEventListener('click', () => {

                    const command = button.dataset.command;

                    document.execCommand(command);

                    editor.focus();
                });

            });

        const previewBtn = document.getElementById('preview-btn');
        const preview = document.getElementById('preview');

        previewBtn.addEventListener('click', () => {
            preview.innerHTML = editor.textContent;
        });

        const html = editor.innerHTML;

        console.log(html);
    </script>
</body>

</html>
